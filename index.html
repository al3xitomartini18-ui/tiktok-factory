<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Factory</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.5}
button{padding:10px 18px;font-size:16px;cursor:pointer;margin:6px 0}#log{background:#f4f4f4;padding:12px;border-radius:8px;white-space:pre-wrap}
nav a{margin-right:12px}</style></head><body>
<h1>TikTok Factory</h1>
<p>Herramienta personal que sube vídeos originales como borrador a la cuenta de TikTok de su propietario.</p>
<nav><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></nav>
<h2>1. Conectar cuenta</h2>
<button id="login">Conectar con TikTok</button>
<p id="status">No conectado</p>
<h2>2. Subir vídeo como borrador</h2>
<p>Vídeo: <code id="vname">videos/demo.mp4</code></p>
<video id="preview" src="videos/demo.mp4" controls width="240"></video><br>
<button id="upload" disabled>Subir a TikTok (borrador)</button>
<h2>Resultado</h2><div id="log">-</div>
<script src="config.js"></script>
<script>
const C=window.CONFIG, $=id=>document.getElementById(id);
const tok=sessionStorage.getItem("tt_access_token");
if(tok){$("status").textContent="Conectado a TikTok (open_id: "+sessionStorage.getItem("tt_open_id")+")";$("upload").disabled=false;}
$("login").onclick=()=>{
  const state=crypto.randomUUID();sessionStorage.setItem("tt_state",state);
  const p=new URLSearchParams({client_key:C.CLIENT_KEY,scope:"user.info.basic,video.upload",response_type:"code",redirect_uri:C.REDIRECT_URI,state});
  location.href="https://www.tiktok.com/v2/auth/authorize/?"+p;
};
$("upload").onclick=async()=>{
  $("log").textContent="Subiendo...";
  const r=await fetch(C.API_BASE+"/upload",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({access_token:tok,video_url:C.SITE_BASE+"videos/demo.mp4"})});
  $("log").textContent=JSON.stringify(await r.json(),null,2);
};
</script></body></html>
